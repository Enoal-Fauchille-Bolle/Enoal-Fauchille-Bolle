name: README

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: links and badges can break without any commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  up-to-date:
    name: README.md matches its sources
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: readme/requirements.txt
      - run: pip install -r readme/requirements.txt
      - run: python readme/build.py --check

  links:
    name: Links and badge logos
    # Kept off push: a third-party outage must never block a push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python readme/check_links.py
